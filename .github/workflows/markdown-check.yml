name: Markdown Health Check

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find broken internal links
        run: |
          python - <<'PY'
          import re, os, sys
          from pathlib import Path

          errors = []
          for md in Path(".").rglob("*.md"):
              if ".github" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              # find markdown links: [...](path)
              for m in re.finditer(r"\[([^\]]+)\]\(([^)]+)\)", text):
                  target = m.group(2)
                  if target.startswith("http") or target.startswith("#") or target.startswith("mailto:"):
                      continue
                  # Resolve relative path
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      errors.append(f"{md}: broken link → {target}")

          if errors:
              print("Broken links:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print("All internal links OK.")
          PY

      - name: Compliance scan (敏感词)
        run: |
          python - <<'PY'
          import re, sys
          from pathlib import Path

          # GitHub 内容不需要 strict compliance,但提示一下
          flags = ["第三方提供商", "中转服务", "破解", "绕过"]
          warnings = []
          for md in Path(".").rglob("*.md"):
              if ".github" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for f in flags:
                  if f in text:
                      warnings.append(f"{md}: contains '{f}'")
          if warnings:
              print("⚠️  Sensitive terms detected (GitHub OK, WeChat NOT OK):")
              for w in warnings:
                  print(f"  {w}")
          else:
              print("No flagged terms.")
          PY
