services:
  backend:
    build: ./backend
    container_name: workbench-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./data/chroma_db:/app/chroma_db
      - ./data/uploads:/app/uploads
      - ./data/db_data:/app/db_data
      - ./backend/.env:/app/.env:ro
      - hf_cache:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    container_name: workbench-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf_cache:
