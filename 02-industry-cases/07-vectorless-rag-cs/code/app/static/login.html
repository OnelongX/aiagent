<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PageIndex AI - 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; }

        .login-left {
            width: 42%; display: flex; flex-direction: column; justify-content: center;
            padding: 60px; gap: 40px;
            background: linear-gradient(180deg, #1E40AF 0%, #2563EB 50%, #3B82F6 100%);
        }
        .login-logo { display: flex; align-items: center; gap: 12px; }
        .login-logo-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.13); display: flex;
            align-items: center; justify-content: center;
        }
        .login-logo-text { font-size: 24px; font-weight: 700; color: #fff; }
        .login-hero-title { font-size: 36px; font-weight: 800; color: #fff; line-height: 1.2; }
        .login-hero-desc { font-size: 16px; color: rgba(255,255,255,0.8); line-height: 1.6; max-width: 420px; }
        .login-features { display: flex; flex-direction: column; gap: 16px; }
        .login-feature { display: flex; align-items: center; gap: 12px; }
        .login-feature-check {
            width: 24px; height: 24px; border-radius: 12px;
            background: rgba(255,255,255,0.13); display: flex;
            align-items: center; justify-content: center;
        }
        .login-feature-text { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.87); }

        .login-right {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 60px; background: #fff;
        }
        .login-form { width: 400px; display: flex; flex-direction: column; gap: 32px; }
        .login-form-header { text-align: center; }
        .login-form-header h1 { font-size: 28px; font-weight: 700; color: #18181B; }
        .login-form-header p { font-size: 14px; color: #71717A; margin-top: 8px; }
        .login-fields { display: flex; flex-direction: column; gap: 18px; }
        .login-field { display: flex; flex-direction: column; gap: 6px; }
        .login-field label { font-size: 13px; font-weight: 600; color: #18181B; }
        .login-field-row { display: flex; align-items: center; justify-content: space-between; }
        .login-field-row a { font-size: 12px; font-weight: 500; color: #2563EB; text-decoration: none; }
        .login-input {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 16px; border-radius: 10px;
            background: #F8FAFC; border: 1px solid #E4E4E7;
        }
        .login-input input {
            flex: 1; border: none; outline: none; background: transparent;
            font-size: 14px; font-family: inherit; color: #18181B;
        }
        .login-input input::placeholder { color: #A1A1AA; }
        .login-input svg { flex-shrink: 0; }
        .login-submit {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: #2563EB; color: #fff; font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer;
            box-shadow: 0 3px 10px rgba(37,99,235,0.2);
            transition: background 0.15s;
        }
        .login-submit:hover { background: #1D4ED8; }
        .login-divider { display: flex; align-items: center; gap: 12px; }
        .login-divider-line { flex: 1; height: 1px; background: #E4E4E7; }
        .login-divider-text { font-size: 12px; font-weight: 500; color: #A1A1AA; }
        .login-social { display: flex; gap: 12px; }
        .login-social-btn {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 12px; border-radius: 10px;
            background: #fff; border: 1px solid #E4E4E7;
            font-size: 13px; font-weight: 500; color: #18181B;
            font-family: inherit; cursor: pointer; transition: background 0.15s;
        }
        .login-social-btn:hover { background: #F8FAFC; }
        .login-signup { text-align: center; font-size: 13px; color: #71717A; }
        .login-signup a { color: #2563EB; font-weight: 600; text-decoration: none; }

        @media (max-width: 900px) {
            .login-left { display: none; }
            .login-right { padding: 24px; }
        }
    </style>
</head>
<body>
    <div class="login-left">
        <div class="login-logo">
            <div class="login-logo-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
            <span class="login-logo-text">PageIndex AI</span>
        </div>
        <div>
            <div class="login-hero-title">AI 驱动的<br>智能客服系统</div>
            <div class="login-hero-desc" style="margin-top:16px">通过 AI 驱动的对话即时解答客户问题，以知识库和实时分析为支撑。</div>
        </div>
        <div class="login-features">
            <div class="login-feature"><div class="login-feature-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div><span class="login-feature-text">RAG 驱动的文档检索</span></div>
            <div class="login-feature"><div class="login-feature-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div><span class="login-feature-text">实时数据分析面板</span></div>
            <div class="login-feature"><div class="login-feature-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg></div><span class="login-feature-text">94%+ 客户满意度</span></div>
        </div>
    </div>
    <div class="login-right">
        <form class="login-form" onsubmit="event.preventDefault(); window.location.href='/';">
            <div class="login-form-header">
                <h1>欢迎回来</h1>
                <p>登录您的账户以继续</p>
            </div>
            <div class="login-fields">
                <div class="login-field">
                    <label>邮箱地址</label>
                    <div class="login-input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><input type="email" placeholder="输入邮箱"></div>
                </div>
                <div class="login-field">
                    <div class="login-field-row"><label>密码</label><a href="#">忘记密码？</a></div>
                    <div class="login-input"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input type="password" placeholder="输入密码"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" style="cursor:pointer"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" x2="23" y1="1" y2="23"/></svg></div>
                </div>
            </div>
            <button type="submit" class="login-submit">登录</button>
            <div class="login-divider"><div class="login-divider-line"></div><span class="login-divider-text">或通过以下方式登录</span><div class="login-divider-line"></div></div>
            <div class="login-social">
                <button type="button" class="login-social-btn"><span style="font-weight:700;color:#EF4444">G</span> Google</button>
                <button type="button" class="login-social-btn"><span style="display:inline-block;width:16px;height:16px;background:#2563EB;border-radius:2px"></span> Microsoft</button>
                <button type="button" class="login-social-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg> SSO</button>
            </div>
            <div class="login-signup">还没有账户？<a href="#">免费注册</a></div>
        </form>
    </div>
</body>
</html>
