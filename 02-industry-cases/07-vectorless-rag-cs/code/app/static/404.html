<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            background: linear-gradient(180deg, #F8FAFC 0%, #FFFFFF 40%, #FFFFFF 100%);
            color: #18181B;
        }
        .err-icon {
            width: 120px; height: 120px; border-radius: 60px;
            background: #EFF6FF; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 8px 24px rgba(37,99,235,0.08);
        }
        .err-code { font-size: 80px; font-weight: 800; color: #2563EB; opacity: 0.15; }
        h1 { font-size: 28px; font-weight: 700; }
        p { font-size: 15px; color: #71717A; line-height: 1.6; text-align: center; max-width: 480px; }
        .err-actions { display: flex; gap: 12px; margin-top: 4px; }
        .err-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 12px; border: none;
            font-family: inherit; font-size: 14px; cursor: pointer;
            text-decoration: none; transition: all 0.15s;
        }
        .err-btn.primary {
            background: #2563EB; color: white; font-weight: 600;
            box-shadow: 0 3px 10px rgba(37,99,235,0.2);
        }
        .err-btn.primary:hover { background: #1D4ED8; }
        .err-btn.secondary {
            background: white; color: #18181B; font-weight: 500;
            border: 1px solid #E4E4E7;
        }
        .err-btn.secondary:hover { background: #F8FAFC; }
        .err-help { font-size: 13px; color: #71717A; }
        .err-help a { color: #2563EB; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="err-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="m8 8 6 6"/><path d="m14 8-6 6"/>
        </svg>
    </div>
    <div class="err-code">404</div>
    <h1>页面未找到</h1>
    <p>您访问的页面不存在或已被移动。请检查网址或返回仪表盘。</p>
    <div class="err-actions">
        <a href="/" class="err-btn primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 返回首页</a>
        <a href="javascript:history.back()" class="err-btn secondary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 返回上页</a>
    </div>
    <div class="err-help">需要帮助？<a href="/">联系客服</a></div>
</body>
</html>
